apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront
  namespace: istio-kt
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: istio-kt
spec:
  selector:
    app: storefront
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment
  namespace: istio-kt
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: istio-kt
spec:
  selector:
    app: payment
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: istio-kt
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: storefront
      version: v1
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: storefront
      containers:
      - name: app
        image: python:3.12-alpine
        command:
        - python
        - -u
        - /app/app.py
        env:
        - name: APP_ROLE
          value: storefront
        - name: APP_VERSION
          value: v1
        - name: PAYMENT_URL
          value: http://payment:8080
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: source
          mountPath: /app
          readOnly: true
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: source
        configMap:
          name: mesh-shop-source
