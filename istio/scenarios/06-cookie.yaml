apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: payment
  namespace: istio-kt
spec:
  hosts:
  - payment.istio-kt.svc.cluster.local
  http:
  - route:
    - destination:
        host: payment.istio-kt.svc.cluster.local
        subset: v2
    retries:
      attempts: 0
    match:
    - headers:
        cookie:
          regex: (^|.*; *)canary=yes(;.*|$)
  - route:
    - destination:
        host: payment.istio-kt.svc.cluster.local
        subset: v1
    retries:
      attempts: 0
