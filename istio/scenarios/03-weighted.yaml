apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: payment
  namespace: istio-kt
spec:
  hosts:
  - payment.istio-kt.svc.cluster.local
  http:
  - route:
    - destination:
        host: payment.istio-kt.svc.cluster.local
        subset: v1
      weight: 90
    - destination:
        host: payment.istio-kt.svc.cluster.local
        subset: v2
      weight: 10
    retries:
      attempts: 0
