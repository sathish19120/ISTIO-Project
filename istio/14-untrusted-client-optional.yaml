apiVersion: v1
kind: Pod
metadata:
  name: untrusted
  namespace: istio-kt
  labels:
    app: untrusted
spec:
  serviceAccountName: default
  containers:
  - name: client
    image: python:3.12-alpine
    command: ["python", "-c", "import time; time.sleep(36000)"]
    resources:
      requests:
        cpu: 25m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
